<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云台-懒得找了 · 云端总控台</title>
<style>
:root{
  /* 新拟态 Neumorphism 浅色主题 */
  --bg:#e0e5ec;--bg2:#d6dbe3;--card:#e0e5ec;--card2:#e8edf4;--line:#c9cfd9;
  --tx:#3a4352;--tx2:#6b7280;--pri:#6c63ff;--pri2:#ff2d78;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --r:14px;
  --neu-dark:#b8bec7;--neu-light:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
body{padding-bottom:76px}
.grad{background:linear-gradient(135deg,#6c63ff18,#ff2d7818)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#3a4668;border-radius:3px}
a{color:#8f9bff;text-decoration:none}
input,select,textarea{width:100%;background:var(--bg);border:none;color:var(--tx);border-radius:12px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit;box-shadow:inset 3px 3px 7px var(--neu-dark),inset -3px -3px 7px var(--neu-light)}
input:focus,select:focus,textarea:focus{box-shadow:inset 3px 3px 7px var(--neu-dark),inset -3px -3px 7px var(--neu-light),0 0 0 2px var(--pri44)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--tx2);margin:10px 0 4px}
button{cursor:pointer;border:none;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;background:var(--card);color:var(--tx);transition:.15s;box-shadow:4px 4px 9px var(--neu-dark),-4px -4px 9px var(--neu-light)}
button:active{transform:scale(.96);box-shadow:inset 3px 3px 7px var(--neu-dark),inset -3px -3px 7px var(--neu-light)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn-ok{background:var(--ok);color:#04120a}
.btn-warn{background:var(--warn);color:#1a1203}
.btn-err{background:var(--err);color:#fff}
.btn-bump{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:800;box-shadow:0 4px 14px #ef444444}
.btn-mini{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-mini.ok{background:#14351f;color:#4ade80}
.btn-mini.warn{background:#3a2a0e;color:#fbbf24}
.btn-mini.err{background:#3a1518;color:#f87171}
.btn-mini.pri{background:#262251;color:#a5b4fc}
.btn-mini.gray{background:#232c47;color:#aab6d8}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.cfg-actions{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.row.cfg-actions::-webkit-scrollbar{display:none}
.row.cfg-actions button{flex:0 0 auto;padding:7px 12px;font-size:12px;white-space:nowrap}
.row .grow{flex:1;min-width:0}
.spacer{flex:1}
/* header - 两行布局，按钮紧凑不溢出 */
header{position:sticky;top:0;z-index:50;background:var(--bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:8px 10px;box-shadow:0 4px 12px var(--neu-dark33)}
.hd-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex-shrink:0}
.hd-title{font-size:14px;font-weight:800;white-space:nowrap}
.hd-sub{font-size:10px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-actions{display:flex;gap:6px;margin-top:8px;align-items:center}
.hd-actions button{flex:1;min-width:0;padding:7px 6px;font-size:12px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub-btn{background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#04120a;font-weight:800;box-shadow:0 4px 16px #22c55e44}
.pub-bump-btn{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;font-weight:800;box-shadow:0 4px 16px #ef444444}
.pub-dis-btn{background:linear-gradient(135deg,#64748b,#334155);color:#fff;font-weight:800}
/* From Uiverse.io by mamyapro123 - 主题切换开关 */
.theme-switch{--toggle-size:14px;--container-width:4.4em;--container-height:2.1em;--container-radius:.38em;--container-light-bg:#5caad4;--container-night-bg:#1b1e36;--circle-container-diameter:2.6em;--sun-moon-diameter:1.7em;--sun-bg:#f5c518;--moon-bg:#d8d4c0;--spot-color:#9b9787;--circle-container-offset:calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);--stars-color:#fff8e1;--clouds-color:#f4f4f4;--back-clouds-color:#bacfe0;--transition:.5s cubic-bezier(0,-.02,.4,1.25);--circle-transition:.3s cubic-bezier(0,-.02,.35,1.17);display:inline-block;flex-shrink:0}
.theme-switch,.theme-switch *,.theme-switch *::before,.theme-switch *::after{box-sizing:border-box;margin:0;padding:0;font-size:var(--toggle-size)}
.theme-switch__container{width:var(--container-width);height:var(--container-height);background-color:var(--container-light-bg);border-radius:var(--container-radius);overflow:hidden;cursor:pointer;position:relative;background-image:linear-gradient(to bottom,var(--container-light-bg) 0%,#4a92bd 100%);transition:all var(--transition);box-shadow:0 0 0 2.5px #1a1a1a,3px 4px 0 2.5px rgba(26,26,26,.22);transform:rotate(-.7deg)}
.theme-switch__container::before{content:"";position:absolute;z-index:1;inset:0;background-image:repeating-linear-gradient(-50deg,transparent,transparent 7px,rgba(255,255,255,.04) 7px,rgba(255,255,255,.04) 8px);border-radius:inherit;pointer-events:none}
.theme-switch__checkbox{display:none}
.theme-switch__circle-container{width:var(--circle-container-diameter);height:var(--circle-container-diameter);background-color:rgba(255,255,255,.1);position:absolute;left:var(--circle-container-offset);top:var(--circle-container-offset);border-radius:var(--container-radius);box-shadow:inset 0 0 0 3.375em rgba(255,255,255,.1),inset 0 0 0 3.375em rgba(255,255,255,.1),0 0 0 .625em rgba(255,255,255,.1),0 0 0 1.25em rgba(255,255,255,.1);display:flex;transition:var(--circle-transition);pointer-events:none}
.theme-switch__circle-container::before{content:"";position:absolute;width:calc(var(--circle-container-diameter) + 1.5em);height:calc(var(--circle-container-diameter) + 1.5em);left:-.75em;top:-.75em;border-radius:50%;background:conic-gradient(transparent 0deg,transparent 8deg,rgba(245,197,24,.52) 8deg,rgba(245,197,24,.52) 22deg,transparent 22deg,transparent 53deg,rgba(245,197,24,.52) 53deg,rgba(245,197,24,.52) 67deg,transparent 67deg,transparent 98deg,rgba(245,197,24,.52) 98deg,rgba(245,197,24,.52) 112deg,transparent 112deg,transparent 143deg,rgba(245,197,24,.52) 143deg,rgba(245,197,24,.52) 157deg,transparent 157deg,transparent 188deg,rgba(245,197,24,.52) 188deg,rgba(245,197,24,.52) 202deg,transparent 202deg,transparent 233deg,rgba(245,197,24,.52) 233deg,rgba(245,197,24,.52) 247deg,transparent 247deg,transparent 278deg,rgba(245,197,24,.52) 278deg,rgba(245,197,24,.52) 292deg,transparent 292deg,transparent 323deg,rgba(245,197,24,.52) 323deg,rgba(245,197,24,.52) 337deg,transparent 337deg,transparent 360deg);animation:rotateSunRays 14s linear infinite;opacity:1;transition:opacity var(--transition);pointer-events:none}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container::before{opacity:0}
@keyframes rotateSunRays{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.theme-switch__sun-moon-container{pointer-events:auto;position:relative;z-index:2;width:var(--sun-moon-diameter);height:var(--sun-moon-diameter);margin:auto;border-radius:var(--container-radius);background-color:var(--sun-bg);box-shadow:.062em .062em .062em 0 rgba(254,255,239,.61) inset,0 -.062em .062em 0 #a1872a inset,.1em .13em 0 .04em #1a1a1a;filter:drop-shadow(.062em .125em .125em rgba(0,0,0,.25));overflow:hidden;transition:var(--transition);transform:scale(1)}
.theme-switch__sun-moon-container:hover{transform:scale(1.1) rotate(5deg)}
.theme-switch__moon{transform:translateX(100%);width:100%;height:100%;background-color:var(--moon-bg);border-radius:inherit;box-shadow:.062em .062em .062em 0 rgba(254,255,239,.61) inset,0 -.062em .062em 0 #969696 inset;transition:all var(--transition),transform .3s ease;position:relative}
.theme-switch__moon:hover{transform:rotate(15deg)}
.theme-switch__spot{position:absolute;top:.75em;left:.312em;width:.75em;height:.75em;border-radius:var(--container-radius);background-color:var(--spot-color);box-shadow:0 .0312em .062em rgba(0,0,0,.25) inset;transition:background-color .3s ease}
.theme-switch__spot:nth-of-type(2){width:.375em;height:.375em;top:.937em;left:1.375em}
.theme-switch__spot:nth-last-of-type(3){width:.25em;height:.25em;top:.312em;left:.812em}
.theme-switch__moon:hover .theme-switch__spot{background-color:#7a7f8c}
.theme-switch__clouds{width:1.25em;height:1.25em;background-color:var(--clouds-color);border-radius:var(--container-radius);position:absolute;bottom:-.625em;left:.312em;box-shadow:.937em .312em var(--clouds-color),-.312em -.312em var(--back-clouds-color),1.437em .375em var(--clouds-color),.5em -.125em var(--back-clouds-color),2.187em 0 var(--clouds-color),1.25em -.062em var(--back-clouds-color),2.937em .312em var(--clouds-color),2em -.312em var(--back-clouds-color),3.625em -.062em var(--clouds-color),2.625em 0 var(--back-clouds-color),4.5em -.312em var(--clouds-color),3.375em -.437em var(--back-clouds-color),4.625em -1.75em 0 .437em var(--clouds-color),4em -.625em var(--back-clouds-color),4.125em -2.125em 0 .437em var(--back-clouds-color);transition:.5s cubic-bezier(0,-.02,.4,1.25)}
.theme-switch__stars-container{position:absolute;color:var(--stars-color);top:-100%;left:.312em;width:2.75em;height:auto;transition:var(--transition)}
.theme-switch__checkbox:checked + .theme-switch__container{background-color:var(--container-night-bg);background-image:linear-gradient(to bottom,var(--container-night-bg) 0%,#252a4a 100%)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container{left:calc(100% - var(--circle-container-offset) - var(--circle-container-diameter))}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container:hover{left:calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - .187em)}
.theme-switch__circle-container:hover{left:calc(var(--circle-container-offset) + .187em)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__moon{transform:translate(0)}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__clouds{bottom:-4.062em}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-container{top:50%;transform:translateY(-50%)}
.theme-switch__container:hover .theme-switch__clouds{transform:translateX(15px) scale(1.02)}
.theme-switch__shooting-star{position:absolute;width:2px;height:2px;background:#fff;top:20%;left:-10%;opacity:0;transition:opacity .3s ease}
.theme-switch__shooting-star-2{position:absolute;width:1px;height:1px;background:#fff;top:35%;left:-10%;opacity:0;transition:opacity .3s ease}
.theme-switch__meteor{position:absolute;width:3px;height:3px;background:#ffd700;border-radius:50%;top:-10%;left:50%;opacity:0;filter:blur(1px);transition:opacity .3s ease}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__shooting-star{animation:shootingStar 2s linear infinite;opacity:1}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__shooting-star-2{animation:shootingStar 3s linear infinite 1s;opacity:1}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__meteor{animation:meteor 4s linear infinite 2s;opacity:1}
@keyframes shootingStar{0%{transform:translateX(0) translateY(0) rotate(45deg);opacity:1}100%{transform:translateX(150px) translateY(150px) rotate(45deg);opacity:0}}
@keyframes meteor{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(150px) scale(.3);opacity:0}}
.theme-switch__stars-cluster{position:absolute;inset:0;opacity:0;transition:opacity .3s ease}
.theme-switch__stars-cluster .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 4px 1px #fff}
.theme-switch__stars-cluster .star:nth-child(1){top:20%;left:20%;animation:twinkle 1s infinite ease-in-out}
.theme-switch__stars-cluster .star:nth-child(2){top:30%;left:55%;animation:twinkle 1s infinite ease-in-out .3s}
.theme-switch__stars-cluster .star:nth-child(3){top:40%;left:80%;animation:twinkle 1s infinite ease-in-out .6s}
.theme-switch__stars-cluster .star:nth-child(4){top:60%;left:30%;animation:twinkle 1s infinite ease-in-out .9s}
.theme-switch__stars-cluster .star:nth-child(5){top:70%;left:65%;animation:twinkle 1s infinite ease-in-out 1.2s}
.theme-switch__aurora{position:absolute;top:0;left:0;right:0;height:20px;background:linear-gradient(90deg,rgba(0,255,255,0) 0%,rgba(0,255,255,.2) 25%,rgba(128,0,255,.2) 50%,rgba(0,255,255,.2) 75%,rgba(0,255,255,0) 100%);opacity:0;filter:blur(4px);transform:translateY(-100%);transition:opacity .3s ease}
.theme-switch__comets{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .3s ease}
.theme-switch__comets .comet{position:absolute;width:2px;height:2px;background:linear-gradient(90deg,#fff 0%,transparent 90%);border-radius:50%;filter:blur(1px)}
.theme-switch__comets .comet:nth-child(1){top:30%;left:-10%;animation:cometMove 4s linear infinite}
.theme-switch__comets .comet:nth-child(2){top:50%;left:-10%;animation:cometMove 6s linear infinite 2s}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
@keyframes cometMove{0%{transform:translateX(0) translateY(0) rotate(-45deg) scale(1);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(200px) translateY(200px) rotate(-45deg) scale(.2);opacity:0}}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-cluster{opacity:1}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__aurora{opacity:1;animation:auroraWave 8s linear infinite}
.theme-switch__checkbox:checked + .theme-switch__container .theme-switch__comets{opacity:1}
@keyframes auroraWave{0%{transform:translateY(-100%) translateX(-50%)}100%{transform:translateY(-100%) translateX(50%)}}
/* 深色新拟态（夜间切换） */
body[data-theme="dark"]{--bg:#2a2e3d;--bg2:#242835;--card:#2a2e3d;--card2:#2f3444;--line:#3a4052;--tx:#e8edf7;--tx2:#9aa7c7;--neu-dark:#1d202c;--neu-light:#3a4052}
body[data-theme="dark"] .grad{background:linear-gradient(135deg,#6c63ff22,#ff2d7822)}
body[data-theme="dark"] header{background:#2a2e3d}
body[data-theme="dark"] nav{background:#2a2e3d}
/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;overflow-x:auto;box-shadow:0 -4px 12px var(--neu-dark33)}
nav button{flex:1;min-width:52px;background:none;border-radius:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--tx2)}
nav button.active{color:var(--pri);font-weight:800}
nav .ico{font-size:17px}
/* main */
main{padding:12px;max-width:960px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:6px 6px 14px var(--neu-dark),-6px -6px 14px var(--neu-light)}
.card h3{font-size:15px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card .hint{font-size:12px;color:var(--tx2)}
/* list item */
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.item-head{display:flex;align-items:center;gap:8px}
.item-title{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;flex-shrink:0}
.badge.ROSE{background:#ff2d7833;color:#ff6ba6}.badge.NEW{background:#22c55e33;color:#4ade80}.badge.GOLD{background:#f59e0b33;color:#fbbf24}.badge.BLUE{background:#3b82f633;color:#60a5fa}
.item-sub{font-size:12px;color:var(--tx2);margin-top:4px;word-break:break-all}
.item-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* dialog */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.dlg{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;padding:16px 16px 24px;animation:slideup .2s}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.dlg-title{font-size:16px;font-weight:800;margin-bottom:4px}
.dlg-actions{display:flex;gap:10px;margin-top:16px}
.dlg-actions button{flex:1;padding:12px}
/* toast */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;background:#1b2440;border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-size:13px;display:none;box-shadow:0 8px 30px #000a;max-width:92vw}
#toast.ok{border-color:#22c55e;color:#4ade80}#toast.err{border-color:#ef4444;color:#f87171}
/* config bar */
.cfg{background:linear-gradient(135deg,#141b33,#1c1233);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.cfg .field{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cfg .field input{flex:1;min-width:120px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.status-dot.loaded{background:var(--ok)}.status-dot.fail{background:var(--err)}.status-dot.idle{background:var(--tx2)}
/* checklist / misc */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:540px){.two-col{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--tx2);padding:24px 10px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--tx2)}
.preview-img{max-width:100%;max-height:160px;border-radius:10px;border:1px solid var(--line);margin-top:6px;object-fit:cover}
.preview-video{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.upload-box{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--tx2);font-size:12px;background:var(--card);margin-top:6px;cursor:pointer}
.upload-box:hover{border-color:var(--pri)}
.upload-box input{display:none}
.divider{height:1px;background:var(--line);margin:10px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.collapse-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.arrow{transition:.2s;display:inline-block}
.arrow.open{transform:rotate(90deg)}
.action-banner{background:linear-gradient(135deg,#1b2440,#201438);border:1px solid #3d4a75;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.action-banner b{color:#a5b4fc}
.code-box{background:#090d16;border:1px solid #232c47;border-radius:8px;padding:10px 12px;font-family:monospace;font-size:12px;color:#93c5fd;overflow-x:auto;margin:6px 0}
</style>
</head>
<body>
<div class="grad" style="position:fixed;inset:0;pointer-events:none;z-index:-1"></div>

<header>
  <div class="hd-top">
    <div class="logo">懒</div>
    <div class="grow" style="min-width:0">
      <div class="hd-title">云台-懒得找了</div>
      <div class="hd-sub" id="hdSub">正在自动连接云端仓库…</div>
    </div>
    <label class="theme-switch" title="浅色/深色主题切换">
      <input type="checkbox" class="theme-switch__checkbox" id="themeToggle" onchange="toggleTheme(this.checked)">
      <div class="theme-switch__container">
        <div class="theme-switch__circle-container">
          <div class="theme-switch__sun-moon-container">
            <div class="theme-switch__moon">
              <div class="theme-switch__spot"></div>
              <div class="theme-switch__spot"></div>
              <div class="theme-switch__spot"></div>
            </div>
          </div>
          <div class="theme-switch__clouds"></div>
          <div class="theme-switch__stars-container">
            <div class="theme-switch__stars-cluster">
              <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
            </div>
            <div class="theme-switch__aurora"></div>
            <div class="theme-switch__comets">
              <span class="comet"></span><span class="comet"></span>
            </div>
            <span class="theme-switch__shooting-star"></span>
            <span class="theme-switch__shooting-star-2"></span>
            <span class="theme-switch__meteor"></span>
          </div>
        </div>
      </div>
    </label>

<script>
"use strict";

// ============ 预置凭据与仓库 ============
// 安全修复：不再内置 Token（旧 Token 已泄露），请在页面输入框粘贴你自己的 GitHub Token
const DEFAULT_TOKEN = "";
const DEFAULT_OWNER = "shuting52";
const DEFAULT_REPO  = "2026-9-21landezhaole";
const CONFIG_PATH   = "admin-data.json";

const S = {
  token: DEFAULT_TOKEN,
  owner: DEFAULT_OWNER,
  repo:  DEFAULT_REPO,
  admin: null,
  sha:   "",
  loaded: false,
  dirty:  false,
  apks:   [],
  // 记录本次操作变更，发布新版本时自动写入更新日志
  changeLog: []
};

// 记录一条变更到待发布日志
function logChange(msg){
  S.changeLog = S.changeLog || [];
  var now = new Date();
  var hh = ("0"+now.getHours()).slice(-2);
  var mm = ("0"+now.getMinutes()).slice(-2);
  S.changeLog.unshift("【"+hh+":"+mm+"】"+msg);
  if(S.changeLog.length > 20) S.changeLog.length = 20;
}

// 主题切换
function toggleTheme(night){
  // 勾选（night=true）= 深色新拟态；不勾选 = 浅色新拟态（默认）
  if(night){
    document.body.setAttribute("data-theme","dark");
  }else{
    document.body.removeAttribute("data-theme");
  }
  try{ localStorage.setItem("lzdz_theme", night ? "dark" : "light"); }catch(e){}
}
// 恢复上次主题
(function(){
  try{
    const t = localStorage.getItem("lzdz_theme");
    if(t === "dark"){ document.body.setAttribute("data-theme","dark"); const c = document.getElementById("themeToggle"); if(c) c.checked = true; }
  }catch(e){}
})();

const $ = id => document.getElementById(id);

function saveCfg(){
  localStorage.setItem("lzdz_cfg", JSON.stringify({
    token: $("cfgToken").value.trim() || S.token,
    owner: $("cfgOwner").value.trim() || S.owner,
    repo:  $("cfgRepo").value.trim()  || S.repo
  }));
  toast("配置已保存","ok");
}

function loadCfg(){
  try{
    const c = JSON.parse(localStorage.getItem("lzdz_cfg") || "{}");
    $("cfgToken").value = c.token || DEFAULT_TOKEN;
    $("cfgOwner").value = c.owner || DEFAULT_OWNER;
    $("cfgRepo").value  = c.repo  || DEFAULT_REPO;
    S.token = $("cfgToken").value;
    S.owner = $("cfgOwner").value;
    S.repo  = $("cfgRepo").value;
  }catch(e){
    $("cfgToken").value = DEFAULT_TOKEN;
    $("cfgOwner").value = DEFAULT_OWNER;
    $("cfgRepo").value  = DEFAULT_REPO;
  }
}

// ============ GitHub API ============
const API = "https://api.github.com";
function ghHeaders(json){
  const h = { Accept: "application/vnd.github+json" };
  if(S.token) h.Authorization = "token " + S.token;
  if(json) h["Content-Type"] = "application/json";
  return h;
}

async function ghGet(p){
  const r = await fetch(`${API}/repos/${S.owner}/${S.repo}/contents/${p}`, { headers: ghHeaders() });
  if(!r.ok) throw new Error("读取失败 HTTP " + r.status + " " + p);
  return r.json();
}

async function ghPut(p, content, msg, sha){
  const body = { message: msg, content: btoa(unescape(encodeURIComponent(content))) };
  if(sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${S.owner}/${S.repo}/contents/${p}`, {
    method: "PUT",
    headers: ghHeaders(true),
    body: JSON.stringify(body)
  });
  if(!r.ok){
    const t = await r.text();
    throw new Error("写入失败 HTTP " + r.status + " " + t.slice(0, 200));
  }
  return r.json();
}

async function ghPutBin(p, base64, msg, sha){
  const body = { message: msg, content: base64 };
  if(sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${S.owner}/${S.repo}/contents/${p}`, {
    method: "PUT",
    headers: ghHeaders(true),
    body: JSON.stringify(body)
  });
  if(!r.ok){
    const t = await r.text();
    throw new Error("二进制上传失败 HTTP " + r.status + " " + t.slice(0, 200));
  }
  return r.json();
}

function rawUrl(p){
  return `https://raw.githubusercontent.com/${S.owner}/${S.repo}/main/${p}`;
}

// ============ 连接 / 加载 ============
async function connect(){
  S.token = $("cfgToken").value.trim();
  S.owner = $("cfgOwner").value.trim();
  S.repo  = $("cfgRepo").value.trim();
  if(!S.owner || !S.repo){ toast("请填写 Owner 和仓库名","err"); return; }
  setSub("正在连接…");
  $("connInfo").innerHTML = '<span class="status-dot idle"></span>连接云端仓库中…';
  try{
    const d = await ghGet(CONFIG_PATH);
    const txt = decodeURIComponent(escape(atob(d.content.replace(/\n/g,""))));
    S.admin = JSON.parse(txt);
    S.sha   = d.sha;
    S.loaded = true;
    S.dirty = false;
    setSub("已连接 · " + S.owner + "/" + S.repo);
    const catCount = (S.admin.home?.categories || []).length;
    const vName = S.admin.version?.name || "1.0";
    const vCode = S.admin.version?.code || 1;
    $("connInfo").innerHTML = `<span class="status-dot loaded"></span>成功加载 admin-data.json · ${catCount}个分类 · 当前发布版本 v${vName} (code:${vCode})`;
    renderAll();
    toast("云端数据加载成功","ok");
    // 异步加载仓库已有 APK
    fetchRepoApks(false);
  }catch(e){
    $("connInfo").innerHTML = '<span class="status-dot fail"></span>加载失败：' + e.message;
    setSub("连接失败");
    toast("连接云端失败："+e.message,"err");
  }
}

function setSub(t){ $("hdSub").textContent = t; }

/**
 * 断开与仓库的连接：清空内存中的云端数据与凭据状态（不删除本地保存的配置）
 */
function disconnect(){
  // 仅断开与仓库的联系，不重置 Token、不改变配置
  S.admin = null; S.sha = ""; S.loaded = false; S.dirty = false; S.apks = []; S.changeLog = [];
  renderAll();
  setSub("已断开仓库连接（Token 保留）");
  $("connInfo").innerHTML = '<span class="status-dot idle"></span>已断开与仓库的连接，Token 已保留，可直接点「连接并加载云端数据」重新连接';
  toast("已断开仓库连接","ok");
}

// 应用：保存所有已填写的版块内容并实时同步到本体软件（零延迟，不升版本号不弹窗）
function applyToDevice(){
  if(!S.admin){ toast("请先连接并加载数据","err"); return; }
  // 若当前有打开的版块表单，先保存
  try{
    if(document.querySelector(".dlg.show") && typeof saveSoft === "function"){ /* 对话框由各版块自行处理 */ }
  }catch(e){}
  toast("正在应用并实时同步到本体软件…","ok");
  publish(false);
}

// ============ 发布逻辑 (双通道：静默同步 / 触发弹窗更新) ============
async function publish(bump = false, actionDesc = ""){
  if(!S.admin){ toast("请先连接并加载数据","err"); return; }
  // 发布新版本前二次确认：防止误操作导致版本号暴涨（如 1.5.1 连续点到 1.5.11）
  if(bump){
    const oldCode = parseInt(S.admin.version?.code) || 1;
    const base = S.admin.version?.name || "1.0";
    const parts = base.split(".");
    let newName = base;
    if(parts.length > 1){
      parts[parts.length - 1] = String(Number(parts[parts.length - 1] || 0) + 1);
      newName = parts.join(".");
    }
    const ok = await confirmDlgHtml(
      `⚠️ 将发布新版本 <b>v${newName}</b>（versionCode: ${oldCode} → ${oldCode+1}）<br>` +
      `本体软件将立即弹出<font color='#f87171'><b>强制更新弹窗</b></font>。<br><br>` +
      `如果只是想保存内容修改并实时同步到本体，请点「✅ 应用」（不升版本号，不弹窗）。<br><br>确定发布新版本吗？`
    );
    if(!ok){ toast("已取消发布","err"); return; }
  }
  const btn = document.querySelector(bump ? ".pub-bump-btn" : ".pub-btn");
  if(btn){ btn.disabled = true; btn.textContent = "⏳ 推送中…"; }
  try{
    if(bump){
      const oldCode = parseInt(S.admin.version?.code) || 1;
      S.admin.version = S.admin.version || {};
      S.admin.version.code = oldCode + 1;
      const base = S.admin.version.name || "1.0";
      const parts = base.split(".");
      if(parts.length > 1){
        parts[parts.length - 1] = String(Number(parts[parts.length - 1] || 0) + 1);
        S.admin.version.name = parts.join(".");
      }else{
        S.admin.version.name = base + ".1";
      }
      const note = actionDesc ? `【控制台推送】${actionDesc}` : "系统功能与站点资源同步更新";
      if(!S.admin.version.changelog) S.admin.version.changelog = [];
      S.admin.version.changelog.unshift(note);
      // 自动同步本次变更记录到更新日志（新增/删除站点、软件、Skill、设置、开屏、欢迎等）
      const changes = (S.changeLog && S.changeLog.length) ? S.changeLog : [];
      changes.forEach(c => {
        S.admin.version.changelog.unshift(c);
      });
      S.admin.updateDialog = S.admin.updateDialog || { title:"发现新版本", changelog:[], confirmText:"立即更新", cancelText:"稍后再说" };
      S.admin.updateDialog.changelog = [note, ...changes, ...(S.admin.updateDialog.changelog || [])].slice(0, 12);
      S.changeLog = [];
    }
    const msg = bump 
      ? `console: [发布新版本 v${S.admin.version.name} code:${S.admin.version.code}] ${actionDesc || "更新"}`
      : `console: 静默同步数据 ${new Date().toLocaleString("zh-CN")}`;
    const d = await ghPut(CONFIG_PATH, JSON.stringify(S.admin, null, 2), msg, S.sha);
    S.sha = d.content.sha;
    S.dirty = false;
    if(bump){
      toast(`🚀 新版本发布成功 (v${S.admin.version.name})！本体软件将即刻弹出更新弹窗`,"ok");
    }else{
      toast("💾 数据静默同步成功！本体软件将在下次刷新时无感应用","ok");
    }
    renderAll();
  }catch(e){
    toast("发布失败："+e.message,"err");
  }
  if(btn){
    btn.disabled = false;
    btn.textContent = bump ? "🚀 触发更新弹窗" : "✅ 应用";
  }
}

function quickBumpPublish(){
  confirmDlg("确定发布新版本并递增版本代码，使本体软件实时触发更新弹窗？").then(ok=>{
    if(ok) publish(true, "管理后台全局版本发布");
  });
}

// ============ 文件上传 ============
function fileToBase64(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result.split(",")[1]);
    rd.onerror = rej;
    rd.readAsDataURL(file);
  });
}

async function uploadFile(file, folder){
  if(!S.admin){ toast("请先连接","err"); return null; }
  const b64 = await fileToBase64(file);
  const safe = file.name.replace(/[^\w.-]/g,"_");
  const p = `${folder}/${Date.now()}_${safe}`;
  await ghPutBin(p, b64, "console: 上传 " + file.name);
  return rawUrl(p);
}

// ============ 通用工具 ============
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(prefix){ return (prefix||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg,type){ const t=$("toast"); t.textContent=msg; t.className=type||""; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display="none",2800); }
function openDlg(html){ $("dlgBody").innerHTML=html; $("dlgMask").classList.add("show"); }
function closeDlg(){ $("dlgMask").classList.remove("show"); }
function confirmDlg(msg){
  return new Promise(res=>{
    openDlg(`<div class="dlg-title">确认操作</div><div style="color:var(--tx2);margin:12px 0 16px">${esc(msg)}</div><div class="dlg-actions"><button class="btn-err" onclick="closeDlg();window.__cf=false">取消</button><button class="btn-ok" onclick="closeDlg();window.__cf=true">确认执行</button></div>`);
    const iv = setInterval(()=>{
      if(window.__cf !== undefined){ clearInterval(iv); const v = window.__cf; window.__cf = undefined; res(v); }
    }, 80);
  });
}

// 支持 HTML 内容的确认弹窗（用于版本发布前提醒，可展示粗体/颜色）
function confirmDlgHtml(html){
  return new Promise(res=>{
    openDlg(`<div class="dlg-title">确认操作</div><div style="color:var(--tx2);margin:12px 0 16px;line-height:1.7">${html}</div><div class="dlg-actions"><button class="btn-err" onclick="closeDlg();window.__cf=false">取消</button><button class="btn-ok" onclick="closeDlg();window.__cf=true">确认发布</button></div>`);
    const iv = setInterval(()=>{
      if(window.__cf !== undefined){ clearInterval(iv); const v = window.__cf; window.__cf = undefined; res(v); }
    }, 80);
  });
}

// 1. 首页管理 (增加/删除，角标/分类，实时推送弹窗)
// ==========================================
function renderHome(){
  if(!S.admin || !S.admin.home) { $("homePage").innerHTML = `<div class="empty">请先点击顶部「连接并加载云端数据」</div>`; return; }
  const cats = S.admin.home.categories || [];
  let html = `<div class="card">
    <div class="action-banner">
      <b>🏠 首页分类与站点管理</b>
      <span class="hint">支持分类/角标实时增删，并推送至本体触发更新弹窗</span>
    </div>
    <div class="row">
      <button class="btn-pri grow" onclick="catForm()">＋ 新增分类</button>
      <button class="btn-ok" onclick="publish(false)">✅ 应用并同步</button>
      <button class="btn-bump" onclick="publish(true,'首页分类与站点结构更新')">🚀 推送并触发本体更新弹窗</button>
    </div>
  </div>`;
  if(!cats.length) html += `<div class="empty">暂无分类，点击上方新增</div>`;

    const cards = c.cards || [];
    html += `<div class="card">
      <div class="collapse-head" onclick="toggleCollapse(this)">
        <span class="arrow">▶</span><span class="chip">${esc(c.iconKey||"grid")}</span>
        <b>${esc(c.name)}</b><span class="hint">(${cards.length} 站点 · ${(c.subcategories||[]).length} 子分类)</span>
        <span class="spacer"></span>
        <button class="btn-mini pri" onclick="event.stopPropagation();catForm(${ci})">✏️ 编辑</button>
        <button class="btn-mini err" onclick="event.stopPropagation();removeCat(${ci})">🗑️ 删除</button>
      </div>
      <div class="cat-body" style="display:none">
        <div class="divider"></div>
        <div class="row" style="margin-bottom:8px">
          <button class="btn-mini pri" onclick="subcatForm(${ci})">＋ 子分类</button>
          <button class="btn-mini pri" onclick="cardForm(${ci})">＋ 站点</button>
          <button class="btn-mini gray" onclick="moveCat(${ci},-1)">⬆ 上移分类</button>
          <button class="btn-mini gray" onclick="moveCat(${ci},1)">⬇ 下移分类</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          ${(c.subcategories||[]).map((s, si) => `<span class="chip">${esc(s.name)} <a style="cursor:pointer" onclick="subcatForm(${ci},${si})">✏️</a> <a style="cursor:pointer;color:var(--err)" onclick="removeSubcat(${ci},${si})">✕</a></span>`).join("")}
        </div>
        ${cards.map((card, ri) => `
        <div class="item" style="margin-bottom:6px">
          <div class="item-head">
            ${card.badge ? `<span class="badge ${esc(card.badgeType||"ROSE")}">${esc(card.badge)}</span>` : ""}
            <span class="item-title">${esc(card.title)}</span>
            <button class="btn-mini gray" onclick="moveCard(${ci},${ri},-1)">↑</button>
            <button class="btn-mini gray" onclick="moveCard(${ci},${ri},1)">↓</button>
            <button class="btn-mini pri" onclick="cardForm(${ci},${ri})">✏️</button>
            <button class="btn-mini err" onclick="removeCard(${ci},${ri})">🗑️</button>
          </div>
          <div class="item-sub">${esc(card.url)}</div>
        </div>`).join("")}
      </div>
    </div>`;
  });
  $("homePage").innerHTML = html;
}

function toggleCollapse(el){
  const body = el.parentElement.querySelector('.cat-body');
  const arrow = el.querySelector('.arrow');
  if(!body) return;
  const isHidden = body.style.display === 'none';
  body.style.display = isHidden ? '' : 'none';
  if(arrow) arrow.classList.toggle('open', isHidden);
}

function catForm(ci){
  const c = ci != null ? S.admin.home.categories[ci] : { id: "", name: "", iconKey: "grid", desc: "", subcategories: [], cards: [] };
  openDlg(`<div class="dlg-title">${ci!=null?"编辑分类":"新增分类"}</div>
  <label>分类 ID（唯一标识，如 ai_models）</label><input id="fCatId" value="${esc(c.id)}" placeholder="如 ai_models">
  <label>分类名称</label><input id="fCatName" value="${esc(c.name)}" placeholder="如 实用工具导航">
  <label>图标 key（sparkle/grid/star/game/tool/music/book/film/gift/globe/code/heart）</label><input id="fCatIcon" value="${esc(c.iconKey)}">
  <label>描述</label><input id="fCatDesc" value="${esc(c.desc)}" placeholder="一句话简介">
  <div class="dlg-actions"><button onclick="closeDlg()">取消</button><button class="btn-pri" onclick="saveCat(${ci==null?-1:ci})">保存</button></div>`);
}
function saveCat(ci){
  const id = $("fCatId").value.trim(), name = $("fCatName").value.trim();
  if(!id || !name){ toast("分类 ID 和名称必填","err"); return; }

async function uploadSoftApk(ev){

// 软件：上传 MD / ZIP 说明文件并自动补全信息
async function uploadSoftDoc(ev){
  const f = ev.target.files[0]; if(!f) return;
  const name = (f.name||"").replace(/\.[^.]+$/,"");
  const box = ev.target.previousElementSibling;
  try{
    if(/\.md$/i.test(f.name)){
      const text = await f.text();
      const firstLine = (text.split(/\r?\n/).find(l=>l.trim())||"").replace(/^#+\s*/,"").trim();
      if(!$("fSwTitle").value) $("fSwTitle").value = firstLine || name;
      if(!$("fSwDesc").value) $("fSwDesc").value = text.replace(/[#*`>\[\]]/g,"").replace(/\s+/g," ").trim().slice(0,120) || "MD 文档自动导入";
      if(!$("fSwTags").value) $("fSwTags").value = "软件 文档 说明";
      if(box) box.innerHTML = `✅ MD 已导入：${esc(f.name)}`;
      toast("MD 文件已导入并自动补全信息","ok");
    }else if(/\.zip$/i.test(f.name)){
      if(box) box.innerHTML = `⏳ 正在上传 ZIP (${Math.round(f.size/1048576*10)/10}MB)…`;
      const url = await uploadFile(f, "dist/uploads");
      if(!$("fSwTitle").value) $("fSwTitle").value = name;
      if(!$("fSwUrl").value) $("fSwUrl").value = url;
      if(!$("fSwDesc").value) $("fSwDesc").value = `${name} 资源包（ZIP）已上传云端`;
      if(!$("fSwTags").value) $("fSwTags").value = "软件 资源包 ZIP";
      if(box) box.innerHTML = `✅ ZIP 已上传：${esc(f.name)}`;
      toast("ZIP 已上传并自动补全信息","ok");
    }else{
      toast("仅支持 .md 或 .zip 文件","err");
    }
  }catch(e){ toast("处理失败："+e.message,"err"); }
}

async function uploadSoftPreview(ev){
  const f = ev.target.files[0]; if(!f) return;
  try{
    const url = await uploadFile(f, "dist/uploads");

function saveUpdate(){
  const logs = $("fUpLogs").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  S.admin.version.code = parseInt($("fUpCode").value) || S.admin.version.code;
  S.admin.version.name = $("fUpName").value.trim() || "1.0";
  S.admin.version.force = $("fUpForce").value === "true";
  S.admin.version.apkUrl = $("fUpApkUrl").value.trim();
  S.admin.version.apkUrlRaw = S.admin.version.apkUrl.replace(/^https:\/\/raw\.githubusercontent\.com\//,"https://github.com/").replace(/\/main\//,"/raw/main/");
  S.admin.version.changelog = logs;
  S.admin.updateDialog = {
    title: $("fUpTitle").value.trim() || "发现新版本",
    changelog: logs,
    confirmText: $("fUpConfirm").value.trim() || "立即更新",
    cancelText: $("fUpCancel").value.trim() || "稍后再说",
    customCss: $("fUpCss").value,
    customHtml: $("fUpHtml").value
  };
  toast("更新弹窗配置已保存","ok");
}

async function bumpAndPublishUpdate(){
  saveUpdate();
  S.admin.version.code = (parseInt(S.admin.version.code) || 1) + 1;
  const base = S.admin.version.name.replace(/(\d+)\.(\d+)$/, (m,a,b)=>a+"."+(Number(b)+1));
  S.admin.version.name = base;
  toast(`版本代码递增至 ${S.admin.version.code} (v${base})，正在发布…`,"ok");
  await publish(true, "新版本 APK 更新发布");
}

        <div class="item-actions">
          <button class="btn-mini ok" onclick="downloadApkMobile('${esc(apk.download_url)}','${esc(apk.name)}')">⬇️ 手机下载体验</button>
          <button class="btn-mini err" onclick="deleteApk('${esc(apk.name)}')">🗑 删除</button>
          <button class="btn-mini ${isCurrent ? "gray" : "warn"}" onclick="setAsReleaseApk('${esc(apk.download_url)}','${esc(apk.name)}')">
            ${isCurrent ? "✅ 当前生效中" : "🚀 设为最新并触发本体更新"}
          </button>
        </div>
      </div>`;
    });
  }

  $("apkPage").innerHTML = html;
}

// 手机下载 APK：Android WebView 内用原生下载器；浏览器内直接跳转
function downloadApkMobile(url, name){
  try{
    // 尝试唤起 Android 原生下载（在云台 APK 中有效）
    if(typeof Android !== "undefined" && Android.download){
      Android.download(url, name);
      toast("已开始下载，请查看通知栏","ok");
      return;
    }
  }catch(e){}
  // 浏览器环境：隐藏 iframe 触发下载（避免直接打开页面）
  try{
    const a = document.createElement("a");
    a.href = url;
    a.download = name || "app.apk";
    a.target = "_blank";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(), 1000);
    toast("已开始下载 " + (name||"") + "，请查看下载记录","ok");
  }catch(e){
    location.href = url;
  }
}

async function deleteApk(name){
  const ok = await confirmDlg(`删除仓库中的 APK「${name}」？\n（删除后不可恢复，建议保留当前生效版本）`);
  if(!ok) return;
  try{
    const meta = await ghGet("dist/apk/" + name);
    const url = `${API}/repos/${S.owner}/${S.repo}/contents/dist/apk/${name}`;
    const r = await fetch(url, {
      method: "DELETE",
      headers: ghHeaders(true),
      body: JSON.stringify({ message: "console: 删除 APK " + name, sha: meta.sha })
    });
    if(!r.ok) throw new Error("删除失败 HTTP " + r.status);
    toast("APK 已删除","ok");
    await fetchRepoApks(false);
  }catch(e){
    toast("删除失败："+e.message,"err");
  }
}

async function fetchRepoApks(showToast = true){
  if(!S.token || !S.owner || !S.repo) return;
  try{
    const data = await ghGet("dist/apk");
    if(Array.isArray(data)){
      S.apks = data.filter(x => x.name.endsWith(".apk"));
    } else {
      S.apks = [];
    }
    renderApk();
    if(showToast) toast(`检测到 ${S.apks.length} 个仓库 APK 安装包`,"ok");
  }catch(e){
    // 目录可能暂未创建
    S.apks = [];
    renderApk();
    if(showToast) toast("仓库检测：暂未发现 dist/apk 目录","warn");
  }
}

async function handleUploadApkToRepo(ev){
  const f = ev.target.files[0]; if(!f) return;
  const status = $("apkUploadStatus");
  status.innerHTML = `⏳ 正在将 ${esc(f.name)} (${Math.round(f.size/1048576*10)/10}MB) 上传至 GitHub 仓库…`;
  try{
    const url = await uploadFile(f, "dist/apk");
    status.innerHTML = `✅ 上传成功！获取直链：<a href="${url}" target="_blank">${url}</a>`;
    toast("APK 上传至仓库成功！","ok");
    // 自动刷新仓库列表
    await fetchRepoApks(false);
    // 询问是否直接触发更新弹窗
    confirmDlg(`APK ${f.name} 已成功入库，是否立即发布新版本并触发本体软件更新弹窗？`).then(ok=>{
      if(ok){
        setAsReleaseApk(url, f.name);
      }
    });
  }catch(e){
    status.innerHTML = `❌ 上传失败：${esc(e.message)}`;
    toast("上传失败："+e.message,"err");
  }
}

async function setAsReleaseApk(url, filename){
  if(!S.admin){ toast("请先连接","err"); return; }
  S.admin.version = S.admin.version || {};
  S.admin.version.code = (parseInt(S.admin.version.code) || 1) + 1;
  const baseName = $("fApkVerName") ? $("fApkVerName").value.trim() : "";
  if(baseName) S.admin.version.name = baseName;
  else {
    const base = S.admin.version.name || "2.1.0";
    S.admin.version.name = base.replace(/(\d+)\.(\d+)$/, (m,a,b)=>a+"."+(Number(b)+1));
  }
  S.admin.version.apkUrl = url;
  S.admin.version.apkUrlRaw = url.replace(/^https:\/\/raw\.githubusercontent\.com\//,"https://github.com/").replace(/\/main\//,"/raw/main/");
  const desc = $("fApkDesc") && $("fApkDesc").value.trim() ? $("fApkDesc").value.trim() : `新版本 APK 制作入库 (${filename})`;
  if(!S.admin.version.changelog) S.admin.version.changelog = [];
  S.admin.version.changelog.unshift(desc);
  S.admin.updateDialog = S.admin.updateDialog || { title: "发现新版本", changelog: [], confirmText: "立即更新", cancelText: "稍后再说" };
  S.admin.updateDialog.changelog = [desc, ...(S.admin.updateDialog.changelog||[])].slice(0, 8);
  toast(`正在发布并同步更新弹窗 (v${S.admin.version.name} code:${S.admin.version.code})…`,"ok");
  await publish(true, desc);
  renderAll();
}

// ============ 导出 / 导入 ============
function exportJson(){
  if(!S.admin){ toast("请先连接","err"); return; }
  const blob = new Blob([JSON.stringify(S.admin, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "admin-data-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  toast("备份已导出","ok");
}

function importJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const obj = JSON.parse(rd.result);
      if(!obj.home || !obj.version){ toast("不是有效的 admin-data.json","err"); return; }
      S.admin = obj; S.sha = null; S.loaded = true;
      renderAll();
      toast("导入成功，请点击发布推送到云端","ok");
    }catch(e){ toast("解析失败："+e.message,"err"); }
  };
  rd.readAsText(f);
}

// ============ 页面加载自启动 ============
loadCfg();
renderAll();
// 自动连接并加载云端
setTimeout(() => {
  connect();
}, 200);

</script>
